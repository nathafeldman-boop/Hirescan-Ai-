<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── Hook: in-view observer ─────────────────────────────── */
function useInView(threshold = 0.15) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setInView(true); obs.disconnect(); }
    }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, [threshold]);
  return [ref, inView];
}

/* ─── SVG Score Ring ──────────────────────────────────────── */
function ScoreRing({ score, color, label }) {
  const [go, setGo] = useState(false);
  const ref = useRef(null);
  const circ = 213.6;

  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setGo(true); obs.disconnect(); }
    }, { threshold: 0.5 });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);

  return (
    <div ref={ref} className="flex flex-col items-center gap-2">
      <svg width="84" height="84" viewBox="0 0 84 84">
        <circle className="ring-track" cx="42" cy="42" r="34" fill="none" strokeWidth="5.5" />
        <circle
          className="ring-fill"
          cx="42" cy="42" r="34"
          fill="none"
          stroke={color}
          strokeWidth="5.5"
          strokeLinecap="round"
          style={{ strokeDashoffset: go ? circ * (1 - score/100) : circ }}
          transform="rotate(-90 42 42)"
        />
        <text x="42" y="46" textAnchor="middle" fontSize="15" fontWeight="600"
              fill={color} fontFamily="DM Sans, sans-serif">{score}</text>
      </svg>
      <span style={{ fontSize:'11px', color:'#52525e', letterSpacing:'.06em', textTransform:'uppercase' }}>{label}</span>
    </div>
  );
}

/* ─── Animated mock UI (hero right side) ─────────────────── */

    { q: "Monthly budget?",            opts: ["< $50 / mo", "$50 – $200", "$200+"] },
    { q: "Primary target market?",     opts: ["B2B SaaS", "Consumer app", "Dev tools"] },
  ];

  useEffect(() => {
    let t;
    if (phase === 'question') {
      t = setTimeout(() => {
        if (qStep < 2) { setQStep(s => s + 1); setSelectedIdx(1); }
        else { setPhase('loading'); setLoadStep(0); }
      }, 2800);
    } else if (phase === 'loading') {
      if (loadStep < 3) {
        t = setTimeout(() => setLoadStep(s => s + 1), 900);
      } else {
        t = setTimeout(() => setPhase('result'), 700);
      }
    } else {
      t = setTimeout(() => { setPhase('question'); setQStep(0); setSelectedIdx(1); }, 5000);
    }
    return () => clearTimeout(t);
  }, [phase, qStep, loadStep]);

  const loadItems = ['Scanning 847 opportunities', 'Scoring market fit', 'Building roadmap', 'Ready'];
  const cur = questions[qStep];
  const progress = phase === 'question' ? Math.round((qStep + 1) * 10) + '%'
                 : phase === 'loading'  ? '100%' : '100%';

  return (
    <div className="float-anim">

        {/* outer glow */}

             style={{ background:'radial-gradient(circle, rgba(91,94,248,.12) 0%, transparent 70%)' }} />

            <div className="flex gap-1.5">
              <div className="w-3 h-3 rounded-full" style={{background:'#ff5f57'}}/>
              <div className="w-3 h-3 rounded-full" style={{background:'#febc2e'}}/>
              <div className="w-3 h-3 rounded-full" style={{background:'#28c840'}}/>
            </div>
            <div className="flex-1 text-center">
              <span className="font-mono text-xs" style={{color:'#3a3a46'}}>launchforge.app</span>
            </div>
          </div>

          {/* progress bar */}
          <div className="px-5 pt-4 pb-3">
            <div className="flex justify-between mb-1.5">
              <span className="text-xs" style={{color:'#52525e'}}>
                {phase === 'question' ? `Step ${qStep+1} of 10` : phase === 'loading' ? 'Generating…' : 'Blueprint ready'}
              </span>
              <span className="text-xs font-mono" style={{color:'#5b5ef8'}}>{progress}</span>
            </div>
            <div className="h-1 rounded-full overflow-hidden" style={{background:'#1c1c24'}}>
              <div className="h-full rounded-full transition-all duration-700"
                   style={{ width: progress, background:'linear-gradient(90deg,#5b5ef8,#a78bfa)' }} />
            </div>
          </div>

          {/* body */}
          <div className="px-5 pb-5">
            {phase === 'question' && (
              <div key={qStep} style={{animation:'fadeUp .4s ease forwards'}}>
                <p className="text-sm font-medium mb-3" style={{color:'#e8e8f0'}}>{cur.q}</p>
                <div className="space-y-2">
                  {cur.opts.map((opt, i) => (
                    <div key={opt}
                         onClick={() => setSelectedIdx(i)}
                         className="px-3 py-2.5 rounded-xl text-sm cursor-pointer transition-all"
                         style={{
                           border: `1px solid ${i === selectedIdx ? '#5b5ef8' : '#1c1c24'}`,
                           background: i === selectedIdx ? 'rgba(91,94,248,.1)' : 'transparent',
                           color: i === selectedIdx ? '#a78bfa' : '#52525e',
                           fontWeight: i === selectedIdx ? '500' : '400'
                         }}>
                      {opt}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {phase === 'loading' && (
              <div className="py-2 space-y-3">
                {loadItems.map((item, i) => (
                  <div key={item} className="flex items-center gap-3 transition-all">
                    <div className="w-5 h-5 rounded-md flex items-center justify-center flex-shrink-0 transition-all"
                         style={{
                           background: i < loadStep ? 'rgba(52,211,153,.15)' : '#1c1c24',
                           border: `1px solid ${i < loadStep ? '#34d399' : '#1c1c24'}`
                         }}>
                      {i < loadStep
                        ? <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5 3.5-4" stroke="#34d399" strokeWidth="1.4" strokeLinecap="round"/></svg>
                        : i === loadStep
                          ? <div className="w-2 h-2 rounded-full" style={{background:'#5b5ef8', animation:'pulse 1s infinite'}}/>
                          : null
                      }
                    </div>
                    <span className="text-xs transition-colors"
                          style={{color: i < loadStep ? '#3a3a46' : i === loadStep ? '#e8e8f0' : '#1c1c24',
                                  textDecoration: i < loadStep ? 'line-through' : 'none'}}>
                      {item}
                    </span>
                  </div>
                ))}
              </div>
            )}

            {phase === 'result' && (
              <div style={{animation:'fadeUp .5s ease forwards'}}>
                <div className="flex items-start justify-between mb-3">
                  <div>
                    <p className="text-xs mb-0.5" style={{color:'#5b5ef8',letterSpacing:'.08em'}}>TOP MATCH</p>
                    <p className="text-lg font-display font-light" style={{color:'#e8e8f0'}}>ReelScript</p>
                  </div>
                  <div className="px-2 py-0.5 rounded-full text-xs font-medium"
                       style={{background:'rgba(52,211,153,.1)',border:'1px solid rgba(52,211,153,.3)',color:'#34d399'}}>
                    94% fit
                  </div>
                </div>
                <div className="grid grid-cols-3 gap-2 mb-3">
                  {[{l:'MRR Target',v:'$8k'},{l:'MVP',v:'12 days'},{l:'Score',v:'88/100'}].map(m => (
                    <div key={m.l} className="rounded-lg p-2 text-center"
                         style={{background:'#131318',border:'1px solid #1c1c24'}}>
                      <p className="text-xs" style={{color:'#52525e'}}>{m.l}</p>
                      <p className="text-sm font-semibold mt-0.5" style={{color:'#e8e8f0'}}>{m.v}</p>
                    </div>
                  ))}
                </div>
                <button className="w-full py-2.5 rounded-xl text-sm font-medium transition-all"
                        style={{background:'linear-gradient(135deg,#5b5ef8,#7c7ff9)',color:'white'}}>
                  View full blueprint →
                </button>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── How It Works ────────────────────────────────────────── */
function HowItWorks() {
  const [ref, inView] = useInView(.1);
  const steps = [
    {

                className="w-full px-6 py-4 text-left flex items-center justify-between transition-colors"
                style={{background: open === i ? '#0f0f14' : 'transparent'}}
                onClick={() => setOpen(open === i ? null : i)}>
                <span className="text-sm font-medium pr-4" style={{color:'#e8e8f0'}}>{faq.q}</span>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                     style={{
                       flexShrink:0, color:'#52525e',
                       transform: open === i ? 'rotate(180deg)' : 'rotate(0deg)',
                       transition:'transform .3s ease'
                     }}>
                  <path d="M4 6l4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                </svg>
              </button>
              <div className={`faq-body ${open === i ? 'open' : ''}`}>
                <p className="px-6 pb-4 text-sm leading-relaxed" style={{color:'#52525e'}}>{faq.a}</p>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}
