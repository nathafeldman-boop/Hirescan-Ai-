name: Ping Search Engines
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to go live
        run: sleep 100

      - name: Ping Google sitemap
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://ursecret.vercel.app/sitemap.xml" \
            -o /dev/null -w "Google sitemap ping: %{http_code}\n"

      - name: Submit all URLs via IndexNow (Bing + Yandex + others)
        run: |
          curl -s -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "ursecret.vercel.app",
              "key": "ursecret-idx-7a2b8c9d",
              "keyLocation": "https://ursecret.vercel.app/ursecret-idx-7a2b8c9d.txt",
              "urlList": [
                "https://ursecret.vercel.app",
                "https://ursecret.vercel.app/quizzes",
                "https://ursecret.vercel.app/quiz/infidelite",
                "https://ursecret.vercel.app/quiz/adopte",
                "https://ursecret.vercel.app/quiz/amoureux",
                "https://ursecret.vercel.app/quiz/vrais-amis",
                "https://ursecret.vercel.app/quiz/orientation"
              ]
            }' -w "\nIndexNow: %{http_code}\n"

      - name: Submit to Bing directly
        run: |
          curl -s -X POST "https://www.bing.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "ursecret.vercel.app",
              "key": "ursecret-idx-7a2b8c9d",
              "keyLocation": "https://ursecret.vercel.app/ursecret-idx-7a2b8c9d.txt",
              "urlList": [
                "https://ursecret.vercel.app",
                "https://ursecret.vercel.app/quizzes",
                "https://ursecret.vercel.app/quiz/infidelite",
                "https://ursecret.vercel.app/quiz/adopte",
                "https://ursecret.vercel.app/quiz/amoureux",
                "https://ursecret.vercel.app/quiz/vrais-amis",
                "https://ursecret.vercel.app/quiz/orientation"
              ]
            }' -w "\nBing direct: %{http_code}\n"

      - name: Submit to Yandex directly
        run: |
          curl -s -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "ursecret.vercel.app",
              "key": "ursecret-idx-7a2b8c9d",
              "keyLocation": "https://ursecret.vercel.app/ursecret-idx-7a2b8c9d.txt",
              "urlList": [
                "https://ursecret.vercel.app",
                "https://ursecret.vercel.app/quizzes",
                "https://ursecret.vercel.app/quiz/infidelite",
                "https://ursecret.vercel.app/quiz/adopte",
                "https://ursecret.vercel.app/quiz/amoureux",
                "https://ursecret.vercel.app/quiz/vrais-amis",
                "https://ursecret.vercel.app/quiz/orientation"
              ]
            }' -w "\nYandex: %{http_code}\n"
