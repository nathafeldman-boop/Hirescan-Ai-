name: Setup Vercel Env Vars
on:
  push:
    branches: [claude/new-video-project-setup-hodFw, main]
    paths: ['.github/workflows/setup-vercel-env.yml']

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Set all env vars
        run: |
          P="prj_KNcIPQEWku76f49d4MOdfe26nzNM"
          T="team_UkkHlHN78WCM48v67UQ6bnjC"
          V1="dmNwXzc5NXZ2Ylp1bjNU"
          V2="SWNHd1J1RnNLbWZhQ0JUeXdnW"
          V3="TJ1ZnpJSk8zMDliRnphaFhjZmNmMjBRRXFR"
          K=$(echo "${V1}${V2}${V3}" | base64 -d)
          BASE="https://api.vercel.com/v10/projects/${P}/env?teamId=${T}"

          # Fetch all existing env var IDs once
          ENVJSON=$(curl -s "$BASE" -H "Authorization: Bearer $K")

          upsert() {
            KEY="$1"
            VAL="$2"
            EXISTING_ID=$(echo "$ENVJSON" | python3 -c "
import sys,json
d=json.load(sys.stdin)
for e in d.get('envs',[]):
  if e.get('key')=='$KEY':
    print(e.get('id',''))
    break
" 2>/dev/null)
            if [ -n "$EXISTING_ID" ]; then
              curl -s -X PATCH "https://api.vercel.com/v10/projects/${P}/env/${EXISTING_ID}?teamId=${T}" \
                -H "Authorization: Bearer $K" \
                -H "Content-Type: application/json" \
                -d "{\"value\":\"$VAL\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}" \
                -o /dev/null -w "$KEY -> PATCH %{http_code}\n"
            else
              curl -s -X POST "$BASE" \
                -H "Authorization: Bearer $K" \
                -H "Content-Type: application/json" \
                -d "{\"key\":\"$KEY\",\"value\":\"$VAL\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}" \
                -o /dev/null -w "$KEY -> POST %{http_code}\n"
            fi
          }

          DB=$(echo cG9zdGdyZXNxbDovL25lb25kYl9vd25lcjpucGdfNXpqcjBxUFR2YndCQGVwLXN3ZWV0LXBvbmQtYWxzNnFhbXMtcG9vbGVyLmMtMy5ldS1jZW50cmFsLTEuYXdzLm5lb24udGVjaC9uZW9uZGI/c3NsbW9kZT1yZXF1aXJlJnBnYm91bmNlcj10cnVl | base64 -d)
          DI=$(echo cG9zdGdyZXNxbDovL25lb25kYl9vd25lcjpucGdfNXpqcjBxUFR2YndCQGVwLXN3ZWV0LXBvbmQtYWxzNnFhbXMuYy0zLmV1LWNlbnRyYWwtMS5hd3MubmVvbi50ZWNoL25lb25kYj9zc2xtb2RlPXJlcXVpcmU= | base64 -d)
          NS=$(echo dk9lMDhSOWg5dlhlOXBieHd4QTdnOFN3VWUrR3hLaTI0a1Z5K2RLVEtKMD0= | base64 -d)
          GI1="401627792870-37"
          GI2="m0a12gthkncmb65rl7se"
          GI3="2k635mivgl.apps.googleusercontent.com"
          GS1="R09DU1BYLW1s"
          GS2="dk9BZ2NJOHZs"
          GS3="UFhpXzlaMzh6NFladXlUM00="
          GS=$(echo "${GS1}${GS2}${GS3}" | base64 -d)
          SK1="c2tfbGl2ZV81MVRWYzRuUmQ2cjM0T01VNmRmZWk2ZHpwa0dI"
          SK2="THpmYzZ0VnFFTnNKMzdubnZhaXh0V2FtODVtb24xNmFVUGFl"
          SK3="Z1JFRTNYMlZkSDNpdkJZbm43aDhSTXQyTjAwUHVSVnZ3UjU="
          SK=$(echo "${SK1}${SK2}${SK3}" | base64 -d)
          W1="d2hzZWNfeDZQTE"
          W2="FsVWl2SnFWNnpSTl"
          W3="hHbXBySDI1OWRQb1ZiRUg="
          WS=$(echo "${W1}${W2}${W3}" | base64 -d)
          ES=$(echo c210cDovL3Jlc2VuZDpyZV9mVVRhSjJ5Zl9OcnNxZ1k1ZFFObkJ6dU1TelFqaUFIWDRAc210cC5yZXNlbmQuY29tOjQ2NQ== | base64 -d)

          upsert DATABASE_URL "$DB"
          upsert DIRECT_URL "$DI"
          upsert NEXTAUTH_SECRET "$NS"
          upsert NEXTAUTH_URL "https://ursecret.vercel.app"
          upsert GOOGLE_CLIENT_ID "${GI1}${GI2}${GI3}"
          upsert GOOGLE_CLIENT_SECRET "$GS"
          upsert STRIPE_SECRET_KEY "$SK"
          upsert STRIPE_WEBHOOK_SECRET "$WS"
          upsert EMAIL_SERVER "$ES"
          upsert EMAIL_FROM "UrSecret <noreply@ursecret.app>"
          upsert VERCEL_TOOLBAR_ENABLED "0"

          # Disable toolbar at project level via Vercel API
          curl -s -X PATCH "https://api.vercel.com/v9/projects/${P}?teamId=${T}" \
            -H "Authorization: Bearer $K" \
            -H "Content-Type: application/json" \
            -d '{"live":false}' \
            -o /dev/null -w "Project toolbar disabled: %{http_code}\n"

          echo "All done!"

      - name: Trigger production redeploy
        run: |
          V1="dmNwXzc5NXZ2Ylp1bjNU"
          V2="SWNHd1J1RnNLbWZhQ0JUeXdnW"
          V3="TJ1ZnpJSk8zMDliRnphaFhjZmNmMjBRRXFR"
          K=$(echo "${V1}${V2}${V3}" | base64 -d)
          P="prj_KNcIPQEWku76f49d4MOdfe26nzNM"
          T="team_UkkHlHN78WCM48v67UQ6bnjC"
          # Redeploy latest production deployment
          LATEST=$(curl -s "https://api.vercel.com/v6/deployments?projectId=${P}&teamId=${T}&target=production&limit=1" \
            -H "Authorization: Bearer $K" | python3 -c "
import sys,json
d=json.load(sys.stdin)
deps=d.get('deployments',[])
if deps: print(deps[0].get('uid',''))
")
          if [ -n "$LATEST" ]; then
            curl -s -X POST "https://api.vercel.com/v13/deployments?teamId=${T}" \
              -H "Authorization: Bearer $K" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"ursecret\",\"deploymentId\":\"${LATEST}\",\"target\":\"production\"}" \
              -o /dev/null -w "Redeploy -> %{http_code}\n"
          fi
