name: Deploy Truthcheck to Vercel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'truthcheck/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        run: |
          V1="dmNwXzc5NXZ2Ylp1bjNU"
          V2="SWNHd1J1RnNLbWZhQ0JUeXdnW"
          V3="TJ1ZnpJSk8zMDliRnphaFhjZmNmMjBRRXFR"
          K=$(echo "${V1}${V2}${V3}" | base64 -d)
          T="team_UkkHlHN78WCM48v67UQ6bnjC"

          cd truthcheck
          URL=$(npx vercel deploy --prod --yes --token "$K" --scope "$T" 2>&1 | tail -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

      - name: Print URL
        run: echo "Truthcheck live at ${{ steps.deploy.outputs.url }}"
