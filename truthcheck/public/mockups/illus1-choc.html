<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1">
<title>Illustration — Choc découverte</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 390px; height: 844px;
    background: #09090b;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,.25) 0%, transparent 70%);
    top: 50%; left: 50%; transform: translate(-50%, -50%);
  }
  .emoji-stack {
    font-size: 90px; margin-bottom: 32px;
    position: relative; z-index: 1;
    filter: drop-shadow(0 0 40px rgba(139,92,246,.6));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  h1 {
    font-size: 36px; font-weight: 900; line-height: 1.15;
    margin-bottom: 16px; position: relative; z-index: 1;
    letter-spacing: -.02em;
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub {
    font-size: 16px; color: #71717a; line-height: 1.65;
    max-width: 300px; margin-bottom: 40px;
    position: relative; z-index: 1;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 999px;
    background: rgba(139,92,246,.15); border: 1px solid rgba(139,92,246,.3);
    font-size: 14px; font-weight: 700; color: #c4b5fd;
    position: relative; z-index: 1;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #a78bfa; }
  .corner-logo {
    position: absolute; bottom: 32px; right: 24px;
    font-size: 16px; font-weight: 900;
  }
  .corner-logo .ur { background: linear-gradient(135deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="emoji-stack">😰</div>
  <h1>Il a découvert<br>un test <em>vraiment</em><br>fiable</h1>
  <p class="sub">Pas comme les autres. Celui-là te donne aussi ta compatibilité amoureuse réelle.</p>
  <div class="pill"><span class="dot"></span> urcecret.site — Test MBTI</div>
  <div class="corner-logo"><span class="ur">Ur</span><span style="color:#71717a">Cecret</span></div>
</body>
</html>
