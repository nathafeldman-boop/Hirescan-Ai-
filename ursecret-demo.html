<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>UrSecret — Tes vraies réponses</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{background:#09090b;color:#f4f4f5;font-family:'Inter',sans-serif;min-height:100vh;overscroll-behavior:none;}
    body{position:relative;overflow-x:hidden;}
    .orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
    .orb1{width:400px;height:400px;top:-100px;left:-100px;background:radial-gradient(circle,rgba(139,92,246,0.18) 0%,transparent 70%);}
    .orb2{width:350px;height:350px;bottom:-80px;right:-80px;background:radial-gradient(circle,rgba(236,72,153,0.15) 0%,transparent 70%);}
    .screen{position:relative;z-index:1;min-height:100vh;display:none;}
    .screen.active{display:block;}

    /* HOME */
    #home{padding:24px 16px 40px;}
    .home-header{text-align:center;padding:32px 0 28px;}
    .home-logo{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;}
    .logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#8b5cf6,#ec4899);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;}
    .logo-text{font-size:26px;font-weight:800;background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .home-sub{color:#a1a1aa;font-size:14px;}
    .quiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:480px;margin:0 auto;}
    .quiz-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px 14px 14px;cursor:pointer;transition:transform 0.18s,background 0.18s,box-shadow 0.18s;text-align:left;position:relative;overflow:hidden;}
    .quiz-card:hover{transform:translateY(-2px);background:rgba(255,255,255,0.07);box-shadow:0 8px 32px rgba(0,0,0,0.4);}
    .quiz-card:active{transform:scale(0.97);}
    .card-glow{position:absolute;inset:0;opacity:0.12;border-radius:16px;pointer-events:none;}
    .card-emoji{font-size:26px;display:block;margin-bottom:8px;}
    .card-title{font-size:12px;font-weight:700;color:#f4f4f5;line-height:1.35;margin-bottom:3px;}
    .card-sub{font-size:10.5px;color:#a1a1aa;line-height:1.3;}

    /* QUIZ */
    #quiz{padding:0;display:flex;flex-direction:column;min-height:100vh;}
    .quiz-topbar{padding:16px 16px 0;display:flex;align-items:center;gap:12px;}
    .back-btn{background:none;border:1px solid rgba(255,255,255,0.08);color:#a1a1aa;width:38px;height:38px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:background 0.15s;}
    .back-btn:hover{background:rgba(255,255,255,0.06);}
    .progress-wrap{flex:1;}
    .progress-meta{display:flex;justify-content:space-between;font-size:11px;color:#a1a1aa;margin-bottom:6px;}
    .progress-bar{height:4px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden;}
    .progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#8b5cf6,#ec4899);transition:width 0.4s ease;}
    .quiz-body{flex:1;padding:24px 16px 24px;display:flex;flex-direction:column;max-width:480px;margin:0 auto;width:100%;}
    .q-emoji{font-size:36px;text-align:center;margin-bottom:16px;}
    .q-text{font-size:18px;font-weight:700;text-align:center;line-height:1.45;margin-bottom:24px;}
    .q-opts{display:flex;flex-direction:column;gap:10px;}
    .opt-btn{background:rgba(255,255,255,0.04);border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;text-align:left;color:#f4f4f5;font-size:14px;font-family:'Inter',sans-serif;font-weight:500;cursor:pointer;transition:all 0.18s;line-height:1.4;}
    .opt-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(139,92,246,0.35);}
    .opt-btn.selected{background:rgba(139,92,246,0.15);border-color:#8b5cf6;color:#fff;}
    .next-wrap{padding:16px 16px 32px;max-width:480px;margin:0 auto;width:100%;}
    .next-btn{width:100%;padding:16px;border:none;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:16px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity 0.2s,transform 0.15s;}
    .next-btn:disabled{opacity:0.35;cursor:not-allowed;}
    .next-btn:not(:disabled):hover{opacity:0.9;}
    .next-btn:not(:disabled):active{transform:scale(0.97);}

    /* RESULTS */
    #results{padding:24px 16px 48px;max-width:480px;margin:0 auto;}
    .res-header{text-align:center;padding-bottom:16px;}
    .res-quiz-title{font-size:12px;color:#a1a1aa;margin-bottom:4px;}
    .res-heading{font-size:22px;font-weight:800;background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .score-ring-wrap{display:flex;justify-content:center;margin:24px 0 20px;}
    .score-ring-container{position:relative;width:180px;height:180px;}
    .score-svg{transform:rotate(-90deg);}
    .score-track{fill:none;stroke:rgba(255,255,255,0.07);stroke-width:8;}
    .score-arc{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(0.22,1,0.36,1);}
    .score-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .score-pct{font-size:36px;font-weight:900;background:linear-gradient(135deg,#8b5cf6,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .score-label{font-size:11px;color:#a1a1aa;font-weight:500;}
    .tier-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:20px 18px;margin-bottom:16px;text-align:center;}
    .tier-emoji{font-size:36px;display:block;margin-bottom:8px;}
    .tier-title{font-size:20px;font-weight:800;margin-bottom:8px;}
    .tier-message{font-size:14px;color:#a1a1aa;line-height:1.6;}
    .analysis-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:18px;margin-bottom:16px;}
    .analysis-title{font-size:13px;font-weight:700;color:#a1a1aa;letter-spacing:0.05em;text-transform:uppercase;margin-bottom:14px;}
    .analysis-line{display:flex;gap:10px;margin-bottom:11px;font-size:13.5px;color:rgba(244,244,245,0.85);line-height:1.55;}
    .analysis-line:last-child{margin-bottom:0;}
    .a-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px;}
    .res-actions{display:flex;gap:10px;margin-top:20px;}
    .retry-btn{flex:1;padding:15px;border:1.5px solid rgba(255,255,255,0.08);border-radius:14px;background:transparent;color:#f4f4f5;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:background 0.15s;}
    .retry-btn:hover{background:rgba(255,255,255,0.06);}
    .home-btn{flex:1;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity 0.2s;}
    .home-btn:hover{opacity:0.88;}
    @media(min-width:520px){.quiz-grid{grid-template-columns:1fr 1fr 1fr;}.q-text{font-size:20px;}}
  </style>
</head>
<body>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<div id="home" class="screen active">
  <div class="home-header">
    <div class="home-logo">
      <div class="logo-icon">🔒</div>
      <span class="logo-text">UrSecret</span>
    </div>
    <p class="home-sub">Tes vraies réponses. Rien que la vérité.</p>
  </div>
  <div class="quiz-grid" id="quizGrid"></div>
</div>

<div id="quiz" class="screen">
  <div class="quiz-topbar">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="qLabel">Question 1/10</span>
        <span id="qPct">0%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </div>
  <div class="quiz-body">
    <div class="q-emoji" id="qEmoji"></div>
    <div class="q-text" id="qText"></div>
    <div class="q-opts" id="qOpts"></div>
  </div>
  <div class="next-wrap">
    <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">Continuer →</button>
  </div>
</div>

<div id="results" class="screen">
  <div class="res-header">
    <div class="res-quiz-title" id="resQuizTitle"></div>
    <div class="res-heading">Tes résultats</div>
  </div>
  <div class="score-ring-wrap">
    <div class="score-ring-container">
      <svg class="score-svg" width="180" height="180" viewBox="0 0 180 180">
        <circle class="score-track" cx="90" cy="90" r="72"/>
        <circle class="score-arc" id="scoreArc" cx="90" cy="90" r="72"
          stroke-dasharray="452.389" stroke-dashoffset="452.389"/>
      </svg>
      <div class="score-center">
        <span class="score-pct" id="scorePct">0%</span>
        <span class="score-label">Score</span>
      </div>
    </div>
  </div>
  <div class="tier-card" id="tierCard">
    <span class="tier-emoji" id="tierEmoji"></span>
    <div class="tier-title" id="tierTitle"></div>
    <div class="tier-message" id="tierMessage"></div>
  </div>
  <div class="analysis-card">
    <div class="analysis-title">Analyse détaillée</div>
    <div id="analysisLines"></div>
  </div>
  <div class="res-actions">
    <button class="retry-btn" onclick="retryQuiz()">Réessayer</button>
    <button class="home-btn" onclick="goHome()">Autre quiz</button>
  </div>
</div>

<script>
const Q=[
 {slug:'infidelite',title:'Est-ce que ton/ta partenaire te cache quelque chose ?',subtitle:'Les signaux que tu ignores peut-être',emoji:'💔',accent:'#ef4444',

 {slug:'vrais-amis',title:'Tes amis seraient-ils là si tu avais vraiment besoin d\'eux ?',subtitle:'Ce que les vrais amis font vraiment',emoji:'👥',accent:'#10b981',

// Build grid
const grid=document.getElementById('quizGrid');
Q.forEach((q,i)=>{
  const c=document.createElement('div');
  c.className='quiz-card';
  c.innerHTML=`<div class="card-glow" style="background:radial-gradient(circle at 30% 30%,${q.accent},transparent 70%)"></div><span class="card-emoji">${q.emoji}</span><div class="card-title">${q.title}</div><div class="card-sub">${q.subtitle}</div>`;
  c.style.borderColor=q.accent+'30';
  c.onclick=()=>start(i);
  grid.appendChild(c);
});

function start(i){cq=Q[i];ci=0;ans=[];sel=null;show('quiz');render();}

function render(){
  const q=cq.qs[ci],tot=cq.qs.length,p=Math.round(ci/tot*100);
  document.getElementById('qLabel').textContent=`Question ${ci+1}/${tot}`;
  document.getElementById('qPct').textContent=p+'%';
  document.getElementById('progressFill').style.width=p+'%';
  document.getElementById('qEmoji').textContent=cq.emoji;
  document.getElementById('qText').textContent=q.t;
  const el=document.getElementById('qOpts');
  el.innerHTML='';
  q.o.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt-btn';b.textContent=o;
    b.onclick=()=>{document.querySelectorAll('.opt-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sel=i;document.getElementById('nextBtn').disabled=false;};
    el.appendChild(b);
  });
  sel=null;
  document.getElementById('nextBtn').disabled=true;
  document.getElementById('nextBtn').textContent=ci<cq.qs.length-1?'Continuer →':'Voir mes résultats →';
}

function nextQuestion(){
  if(sel===null)return;
  ans.push(sel);
  if(ci<cq.qs.length-1){ci++;sel=null;render();}
  else showResults();
}

function showResults(){
  const total=ans.reduce((a,b)=>a+b,0),max=cq.qs.length*3,pct=Math.round(total/max*100);
  const tier=cq.tiers.find(t=>pct>=t.min&&pct<t.max)||cq.tiers[cq.tiers.length-1];
  document.getElementById('resQuizTitle').textContent=cq.emoji+' '+cq.title;
  document.getElementById('scorePct').textContent=pct+'%';
  const arc=document.getElementById('scoreArc');
  arc.style.stroke=cq.accent;arc.style.strokeDashoffset=452.389;
  arc.style.filter=`drop-shadow(0 0 8px ${cq.accent}80)`;
  document.getElementById('tierEmoji').textContent=tier.emoji;
  document.getElementById('tierTitle').textContent=tier.title;
  document.getElementById('tierTitle').style.color=tier.glow;
  document.getElementById('tierMessage').textContent=tier.msg;
  document.getElementById('tierCard').style.borderColor=tier.glow+'40';
  document.getElementById('tierCard').style.background=tier.glow+'0d';
  const lines=getAnalysis(pct,tier.title);
  const al=document.getElementById('analysisLines');al.innerHTML='';
  lines.forEach(l=>{const d=document.createElement('div');d.className='analysis-line';d.innerHTML=`<div class="a-dot" style="background:${cq.accent}"></div><span>${l}</span>`;al.appendChild(d);});
  show('results');
  requestAnimationFrame(()=>setTimeout(()=>{arc.style.strokeDashoffset=452.389-(pct/100*452.389);},100));
  anim(0,pct,1200,v=>document.getElementById('scorePct').textContent=v+'%');
}

function getAnalysis(s,title){
  const h=s>=60,m=s>=30&&s<60;
  if(cq.slug==='infidelite') return [
    `Ton score de ${s}% indique ${s>=70?'une forte probabilité':s>=40?'des signaux préoccupants':'peu de raisons d\'alarme'} concernant la fidélité de ton/ta partenaire.`,
    `Les comportements que tu décris ${s>=60?'correspondent à des schémas classiques d\'infidélité.':'peuvent s\'expliquer par d\'autres facteurs comme le stress.'}`,
    `${s>=70?'L\'accumulation de ces signaux est difficile à ignorer.':s>=40?'Certains signaux méritent attention.':'L\'absence de signaux forts est rassurante.'}`,
    `La communication reste l'outil le plus puissant pour clarifier une situation comme celle-ci.`,
    `${s>=60?'Une conversation directe, sans accusation, est fortement recommandée.':'Garder un œil sur l\'évolution des comportements sera utile.'}`,
    `Les experts s'accordent à dire que l'instinct du/de la partenaire est rarement complètement faux.`,
    `${s>=70?'Protège-toi émotionnellement et entoure-toi de personnes de confiance.':'Prends soin de toi et de ta confiance en toi.'}`,
    `Une thérapie de couple peut aider à rétablir la confiance, quelle que soit la réalité.`,
    `${s>=60?'Tu mérites une relation honnête et respectueuse.':'Une relation saine est possible avec les bons outils.'}`,
    `Rappelle-toi : tu mérites d'être aimé(e) et respecté(e), peu importe la conclusion.`,
  ];
  return [
    `Ton score de ${s}% reflète honnêtement tes réponses à ce questionnaire.`,
    `Le résultat "${title}" correspond à un profil précis analysé selon tes réponses.`,
    `${h?'Les signaux identifiés sont significatifs et méritent attention.':m?'Quelques éléments méritent une réflexion plus approfondie.':'La situation semble saine dans l\'ensemble.'}`,
    `Prendre du recul et se questionner honnêtement aide toujours à mieux évaluer une situation.`,
    `La communication ouverte est souvent la clé pour résoudre les doutes et renforcer les liens.`,
    `${h?'N\'hésite pas à chercher du soutien auprès d\'un(e) professionnel(le) ou d\'un proche de confiance.':'Continue à faire confiance à ton instinct et à prendre soin de toi.'}`,
    `Ton ressenti compte autant que les faits objectifs — ne le minimise pas.`,
    `Les relations humaines sont complexes et évoluent constamment. Rien n'est figé.`,
    `${s>=50?'Il est peut-être temps d\'agir pour améliorer ta situation.':'Conserve ce qui fonctionne bien et continue dans cette direction.'}`,
    `Tu mérites de te sentir bien et épanoui(e) dans toutes tes relations importantes.`,
  ];
}

function anim(from,to,dur,cb){
  const t0=performance.now();
  (function tick(now){const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);cb(Math.round(from+(to-from)*e));if(p<1)requestAnimationFrame(tick);})(t0);
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function goHome(){show('home');}
function retryQuiz(){start(Q.indexOf(cq));}
</script>
