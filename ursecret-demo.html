<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrSecret — Tes vraies réponses</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#09090b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}

/* Animated bg */
.bg-glow{position:fixed;inset:0;pointer-events:none;z-index:0}
.bg-glow::before{content:'';position:absolute;top:-20%;left:-10%;width:60%;height:60%;background:radial-gradient(ellipse,rgba(139,92,246,.15) 0%,transparent 70%);animation:pulse1 8s ease-in-out infinite}
.bg-glow::after{content:'';position:absolute;bottom:-20%;right:-10%;width:50%;height:50%;background:radial-gradient(ellipse,rgba(236,72,153,.12) 0%,transparent 70%);animation:pulse2 10s ease-in-out infinite}
@keyframes pulse1{0%,100%{transform:scale(1) translate(0,0);opacity:.8}50%{transform:scale(1.2) translate(5%,5%);opacity:1}}
@keyframes pulse2{0%,100%{transform:scale(1) translate(0,0);opacity:.6}50%{transform:scale(1.3) translate(-5%,-5%);opacity:1}}

/* Layout */
.screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.hidden{display:none!important}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 24px}
.logo{font-size:20px;font-weight:900;letter-spacing:-.5px}
.logo span:first-child{background:linear-gradient(135deg,#a78bfa,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.step-count{font-size:12px;color:#52525b}

/* Progress bar */
.progress-wrap{padding:0 24px;margin-top:8px}
.progress-track{height:4px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.progress-bar{height:100%;background:linear-gradient(90deg,#8b5cf6,#ec4899);border-radius:99px;transition:width .5s ease}

/* Content */
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:32px}
.inner{width:100%;max-width:480px}

/* Typography */
h1{font-size:clamp(24px,5vw,36px);font-weight:900;line-height:1.2;text-align:center;margin-bottom:8px}
h2{font-size:clamp(20px,4vw,28px);font-weight:900;line-height:1.25;text-align:center;margin-bottom:24px}
.sub{font-size:13px;color:#71717a;text-align:center;margin-bottom:32px}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a78bfa;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.2);border-radius:99px;padding:4px 12px;margin-bottom:12px}

/* Quiz cards (landing) */
.quiz-grid{display:flex;flex-direction:column;gap:10px}
.quiz-card{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .2s;text-align:left}
.quiz-card:hover{background:rgba(255,255,255,.06);border-color:rgba(139,92,246,.3);transform:translateY(-1px)}
.qc-emoji{font-size:28px;flex-shrink:0}
.qc-text{flex:1}
.qc-label{font-size:15px;font-weight:700;color:#f4f4f5;line-height:1.3}
.qc-desc{font-size:12px;color:#71717a;margin-top:2px}
.qc-arrow{color:#52525b;flex-shrink:0}

/* Onboarding inputs */
.text-input{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 20px;color:#fff;font-size:17px;outline:none;transition:all .2s;margin-bottom:24px}
.text-input::placeholder{color:#52525b}
.text-input:focus{border-color:rgba(139,92,246,.5);background:rgba(255,255,255,.07)}
.choice-list{display:flex;flex-direction:column;gap:10px}
.choice-btn{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:15px 20px;color:#e4e4e7;font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:all .2s}
.choice-btn:hover{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3)}

/* Primary button */
.btn{width:100%;background:linear-gradient(135deg,#8b5cf6,#ec4899);border:none;border-radius:14px;padding:16px;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-wrap{margin-top:4px}

/* Question answer options */
.option-list{display:flex;flex-direction:column;gap:10px}
.option-btn{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px 18px;color:#d4d4d8;font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .2s;line-height:1.4}
.option-btn:hover{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3);color:#fff}
.option-btn.selected{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.5);color:#fff}

/* Results */
.results-wrap{text-align:center;padding:0 4px}
.score-ring-wrap{position:relative;width:140px;height:140px;margin:0 auto 24px}
.score-ring-wrap svg{transform:rotate(-90deg)}
.score-ring-track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:10}
.score-ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1)}
.score-ring-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-num{font-size:32px;font-weight:900;line-height:1}
.score-pct{font-size:12px;color:#71717a;margin-top:2px}

.tier-badge{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;font-size:15px;font-weight:700;margin-bottom:16px;border:1px solid rgba(255,255,255,.1)}
.tier-emoji{font-size:22px}

.result-message{font-size:15px;color:#a1a1aa;line-height:1.7;margin-bottom:24px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:18px 20px;text-align:left}

.result-lines{text-align:left;margin-bottom:24px}
.rl-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#52525b;margin-bottom:12px}
.rl-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:12px;margin-bottom:8px}
.rl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.rl-text{font-size:13px;color:#d4d4d8}

.restart-btn{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px;color:#a1a1aa;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:40px}
.restart-btn:hover{background:rgba(255,255,255,.09);color:#fff}

/* Fade transition */
.fade-enter{animation:fadeIn .3s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>

      { q: 'Est-ce que tu imagines ta vie future avec cette personne à long terme ?', opts: ['Non, je vis au jour le jour','Parfois une image floue','Souvent des projections positives','Toujours, je la vois dans mon avenir le plus lointain'] },
      { q: 'Est-ce que tu te sens plus toi-même avec cette personne qu\'avec n\'importe qui d\'autre ?', opts: ['Non, je joue un rôle avec elle','À peu près autant qu\'avec mes autres proches','Oui, je me sens libéré(e) d\'être moi-même','Totalement, c\'est la seule personne avec qui je suis pleinement moi'] },
      { q: 'Est-ce que tu ressens une paix et une sécurité dans cette relation ?', opts: ['Non, c\'est souvent tendu','Parfois, selon les moments','Souvent, je me sens en sécurité','Toujours, c\'est la relation la plus apaisante que j\'aie eue'] },
      { q: 'Est-ce que tu as confiance en cette personne profondément ?', opts: ['Non, j\'ai des doutes importants','Partiellement','Oui, une confiance solide','Totalement, sans réserve'] },
      { q: 'Est-ce que cette relation te donne envie d\'être une meilleure version de toi-même ?', opts: ['Non, ça ne change rien','Un peu, elle m\'inspire parfois','Souvent, sa présence m\'élève','Toujours, je veux être meilleur(e) pour moi et pour lui/elle'] },
      { q: 'Est-ce que vos valeurs fondamentales sont alignées ?', opts: ['Non, on est très différents','Quelques points communs','Largement alignés','Profondément en accord sur ce qui compte vraiment'] },
      { q: 'Dans ton cœur le plus profond, est-ce que tu sais que tu l\'aimes vraiment ?', opts: ['Non, je ne suis pas sûr(e)','Je pense, mais avec des doutes','Oui, je le crois sincèrement','Oui, sans aucun doute, je le sais'] },
    ],
    tiers: [
      { min:0, max:20, emoji:'🤍', title:'Attraction sans amour', msg:'Ce que tu ressens semble davantage de l\'attraction ou de l\'attachement que de l\'amour véritable. C\'est déjà beau, mais l\'amour profond comporte d\'autres dimensions encore à explorer.', color:'#a1a1aa' },
      { min:20, max:40, emoji:'💛', title:'Affection sincère', msg:'Tu ressens une affection sincère et des sentiments réels. C\'est un beau début. L\'amour peut grandir et s\'approfondir avec le temps et l\'engagement mutuel.', color:'#facc15' },
      { min:40, max:60, emoji:'🧡', title:'Amour naissant', msg:'Tes sentiments ont les contours d\'un amour véritable. La profondeur est là, elle se consolide. Prends soin de cette relation, elle a un beau potentiel.', color:'#fb923c' },
      { min:60, max:80, emoji:'❤️', title:'Amour véritable', msg:'Ce que tu ressens correspond aux caractéristiques d\'un amour véritable. Respect, confiance, soutien mutuel — les bases sont solides. Chéris cette relation.', color:'#f87171' },
      { min:80, max:101, emoji:'❤️‍🔥', title:'Amour profond et rare', msg:'Ce que tu décris est un amour profond et authentique. Une connexion rare qui mérite d\'être protégée et cultivée chaque jour. Tu as trouvé quelque chose de précieux.', color:'#fb7185' },
    ],
    lines: ['Amour inconditionnel vs attachement mesuré','Profondeur de la connexion analysée','Alignement des valeurs évalué','Authenticité des sentiments révélée']
  },
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let state = {
  screen: 'landing',   // landing | onboarding | quiz | results
  quiz: null,
  onboardStep: 0,      // 0=name, 1=age, 2=gender
  name: '',
  scores: [],
  currentQ: 0,
  selectedOpt: null,
};

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  if (state.screen === 'landing') app.innerHTML = renderLanding();
  else if (state.screen === 'onboarding') app.innerHTML = renderOnboarding();
  else if (state.screen === 'quiz') app.innerHTML = renderQuiz();
  else if (state.screen === 'results') app.innerHTML = renderResults();
  attachEvents();
}

function renderLanding() {
  const cards = QUIZZES.map(q => `
    <button class="quiz-card" data-slug="${q.slug}">
      <span class="qc-emoji">${q.emoji}</span>
      <div class="qc-text">
        <div class="qc-label">${q.label}</div>
        <div class="qc-desc">${q.desc}</div>
      </div>
      <svg class="qc-arrow" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>`).join('');
  return `
    <div class="screen">
      <div class="hdr">
        <span class="logo"><span>Ur</span><span style="color:#fff">Secret</span></span>
        <span class="step-count" style="font-size:11px;color:#3f3f46;background:rgba(139,92,246,.1);padding:3px 10px;border-radius:99px;border:1px solid rgba(139,92,246,.15)">100% anonyme</span>
      </div>
      <div class="content">
        <div class="inner fade-enter">
          <div style="text-align:center;margin-bottom:28px">
            <div class="badge">IA • Analyse sans filtre</div>
            <h1>Tes vraies réponses.<br>Sans filtre.</h1>
            <p class="sub" style="margin-top:8px">Choisis ce qui te préoccupe en ce moment</p>
          </div>
          <div class="quiz-grid">${cards}</div>
          <p style="text-align:center;font-size:11px;color:#3f3f46;margin-top:20px;margin-bottom:16px">15 quiz · 100% gratuit · résultats complets</p>
        </div>
      </div>
    </div>`;
}

function renderOnboarding() {
  const steps = ['name','age','gender'];
  const step = state.onboardStep;
  const progress = ((step) / 3) * 100;

  let content = '';
  if (step === 0) {
    content = `
      <h2>C'est courageux de faire face à ça.<br>Comment tu t'appelles ?</h2>
      <input class="text-input" id="name-input" type="text" placeholder="Ton prénom..." maxlength="40" value="${state.name}" autocomplete="off">
      <div class="btn-wrap"><button class="btn" id="name-next" ${!state.name.trim() ? 'disabled' : ''}>Continuer</button></div>`;
  } else if (step === 1) {
    const ages = ['- de 18 ans','18–24 ans','25–34 ans','35–44 ans','45 ans et +'];
    content = `
      <h2>Quel âge as-tu, ${state.name || 'toi'} ?</h2>
      <div class="choice-list">${ages.map(a=>`<button class="choice-btn" data-age="${a}">${a}</button>`).join('')}</div>`;
  } else if (step === 2) {
    const genders = ['Un homme','Une femme','Non-binaire','Je préfère ne pas dire'];
    content = `
      <h2>Tu t'identifies comme ?</h2>
      <div class="choice-list">${genders.map(g=>`<button class="choice-btn" data-gender="${g}">${g}</button>`).join('')}</div>`;
  }

  return `
    <div class="screen">
      <div class="hdr">
        <span class="logo"><span>Ur</span><span style="color:#fff">Secret</span></span>
        <span class="step-count">${step+1} / 3</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-bar" style="width:${progress}%"></div></div>
      </div>
      <div class="content">
        <div class="inner fade-enter">${content}</div>
      </div>
    </div>`;
}

function renderQuiz() {
  const quiz = state.quiz;
  const qi = state.currentQ;
  const total = quiz.questions.length;
  const progress = (qi / total) * 100;
  const q = quiz.questions[qi];
  const opts = q.opts.map((o, i) => `
    <button class="option-btn ${state.selectedOpt === i ? 'selected' : ''}" data-opt="${i}">${o}</button>`).join('');

  return `
    <div class="screen">
      <div class="hdr">
        <span class="logo"><span>Ur</span><span style="color:#fff">Secret</span></span>
        <span class="step-count">${qi+1} / ${total}</span>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-bar" style="width:${progress}%"></div></div>
      </div>
      <div class="content">
        <div class="inner fade-enter">
          <h2 style="margin-bottom:28px;font-size:clamp(17px,4vw,22px)">${q.q}</h2>
          <div class="option-list">${opts}</div>
          ${state.selectedOpt !== null ? `
          <div class="btn-wrap" style="margin-top:20px">
            <button class="btn" id="next-btn">${qi < total-1 ? 'Continuer' : 'Voir mes résultats'}</button>
          </div>` : ''}
        </div>
      </div>
    </div>`;
}

function getPercentage() {
  const maxScore = state.quiz.questions.length * 3;
  const total = state.scores.reduce((a,b)=>a+b,0);
  return maxScore > 0 ? Math.round((total / maxScore) * 100) : 0;
}

function getTier(pct) {
  const tiers = state.quiz.tiers;
  return tiers.find(t => pct >= t.min && pct < t.max) || tiers[tiers.length-1];
}

function renderResults() {
  const quiz = state.quiz;
  const pct = getPercentage();
  const tier = getTier(pct);
  const color = tier.color;

  const circumference = 2 * Math.PI * 54;
  const offset = circumference - (pct / 100) * circumference;

  const lines = quiz.lines.map(l => `
    <div class="rl-item">
      <div class="rl-dot" style="background:${color}"></div>
      <div class="rl-text">${l}</div>
    </div>`).join('');

  return `
    <div class="screen">
      <div class="hdr">
        <span class="logo"><span>Ur</span><span style="color:#fff">Secret</span></span>
        <span class="step-count" style="color:#52525b">Résultats</span>
      </div>
      <div class="content" style="padding-top:16px">
        <div class="inner fade-enter">
          <div class="results-wrap">
            <p style="font-size:13px;color:#71717a;margin-bottom:16px">Analyse complète de ${state.name || 'ta'} situation</p>

            <div class="score-ring-wrap">
              <svg width="140" height="140" viewBox="0 0 140 140">
                <circle class="score-ring-track" cx="70" cy="70" r="54"/>
                <circle class="score-ring-fill" cx="70" cy="70" r="54"
                  stroke="${color}"
                  stroke-dasharray="${circumference}"
                  stroke-dashoffset="${offset}"
                  style="filter:drop-shadow(0 0 8px ${color}40)"/>
              </svg>
              <div class="score-ring-text">
                <div class="score-num" style="color:${color}">${pct}%</div>
                <div class="score-pct">score</div>
              </div>
            </div>

            <div class="tier-badge" style="background:${color}18;border-color:${color}40">
              <span class="tier-emoji">${tier.emoji}</span>
              <span style="color:${color}">${tier.title}</span>
            </div>

            <div class="result-message">${tier.msg}</div>

            <div class="result-lines">
              <div class="rl-title">Analyse détaillée</div>
              ${lines}
            </div>

            <button class="restart-btn" id="restart-btn">Faire un autre quiz →</button>
          </div>
        </div>
      </div>
    </div>`;
}

// ─────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────
function attachEvents() {
  // Landing: pick quiz
  document.querySelectorAll('.quiz-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const slug = btn.dataset.slug;
      state.quiz = QUIZZES.find(q => q.slug === slug);
      state.scores = [];
      state.currentQ = 0;
      state.selectedOpt = null;
      state.onboardStep = 0;
      state.name = '';
      state.screen = 'onboarding';
      render();
    });
  });

  // Onboarding: name input
  const nameInput = document.getElementById('name-input');
  if (nameInput) {
    nameInput.focus();
    nameInput.addEventListener('input', e => {
      state.name = e.target.value;
      const btn = document.getElementById('name-next');
      if (btn) btn.disabled = !state.name.trim();
    });
    nameInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && state.name.trim()) { state.onboardStep = 1; render(); }
    });
  }
  const nameNext = document.getElementById('name-next');
  if (nameNext) {
    nameNext.addEventListener('click', () => {
      if (state.name.trim()) { state.onboardStep = 1; render(); }
    });
  }

  // Age choice
  document.querySelectorAll('[data-age]').forEach(btn => {
    btn.addEventListener('click', () => { state.onboardStep = 2; render(); });
  });

  // Gender choice → start quiz
  document.querySelectorAll('[data-gender]').forEach(btn => {
    btn.addEventListener('click', () => { state.screen = 'quiz'; render(); });
  });

  // Quiz: select option
  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.selectedOpt = parseInt(btn.dataset.opt);
      render();
    });
  });

  // Quiz: next
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) {
    nextBtn.addEventListener('click', () => {
      if (state.selectedOpt === null) return;
      state.scores.push(state.selectedOpt); // score = index (0,1,2,3)
      if (state.currentQ < state.quiz.questions.length - 1) {
        state.currentQ++;
        state.selectedOpt = null;
        render();
      } else {
        state.screen = 'results';
        render();
      }
    });
  }

  // Restart
  const restartBtn = document.getElementById('restart-btn');
  if (restartBtn) {
    restartBtn.addEventListener('click', () => {
      state.screen = 'landing';
      state.quiz = null;
      state.scores = [];
      render();
    });
  }
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
render();
</script>
</body>
</html>
