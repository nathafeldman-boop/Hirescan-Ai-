<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

[data-theme="dark"]{
  --bg:#09090b;--surface:#111113;--surface2:#18181b;--border:#27272a;
  --text:#fafafa;--text2:#a1a1aa;--text3:#52525b;--accent:#fff;--ring:rgba(255,255,255,.07);
}
[data-theme="light"]{
  --bg:#f8f8fa;--surface:#ffffff;--surface2:#f4f4f5;--border:#e4e4e7;
  --text:#09090b;--text2:#71717a;--text3:#a1a1aa;--accent:#09090b;--ring:rgba(0,0,0,.05);
}

body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes dashIn{to{stroke-dashoffset:var(--target-offset)}}

.au{animation:fadeUp .38s ease both}
.af{animation:fadeIn .3s ease both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.16s}.d4{animation-delay:.22s}.d5{animation-delay:.28s}

nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);background:var(--bg)}

#screen{min-height:100vh;padding-top:56px}

.btn-p{background:var(--text);color:var(--bg);border:none;border-radius:9px;padding:13px 22px;font-size:.9375rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:opacity .15s;letter-spacing:-.01em}
.btn-p:hover{opacity:.82}
.btn-g{background:transparent;color:var(--text2);border:1px solid var(--border);border-radius:9px;padding:11px 20px;font-size:.875rem;font-weight:500;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-g:hover{background:var(--surface2);color:var(--text)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}

.opt{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;cursor:pointer;transition:all .14s;display:flex;align-items:flex-start;gap:12px;user-select:none;position:relative}
.opt:hover{background:var(--surface2);border-color:var(--text3)}
.opt.sel{background:var(--ring);border-color:var(--text)}

.tag{display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:500;color:var(--text2)}

.mono{font-family:'JetBrains Mono',monospace}

.code{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:18px;white-space:pre-wrap;word-break:break-word;color:var(--text2);max-height:300px;overflow-y:auto}

.prog-track{height:2px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--text);border-radius:2px;transition:width .4s ease}

.cp-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 11px;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.cp-btn:hover{background:var(--surface2)}
.cp-btn.ok{color:#22c55e;border-color:#22c55e}

.sh{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:16px}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.ldot{width:6px;height:6px;border-radius:50%;background:var(--text2);animation:pulse 1.2s ease-in-out infinite}
.ldot:nth-child(2){animation-delay:.2s}
.ldot:nth-child(3){animation-delay:.4s}

.ring-svg circle.tr{stroke:var(--border)}
.ring-svg circle.fr{stroke:var(--text);transition:stroke-dashoffset 1s cubic-bezier(.34,1.56,.64,1)}

.rm-item{display:flex;gap:16px;padding:11px 0;border-bottom:1px solid var(--border)}
.rm-item:last-child{border-bottom:none}
.comp-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--border)}
.comp-row:last-child{border-bottom:none}
</style>

// ─── SCORING ──────────────────────────────────────────────────────────────────
function score(idea, ans) {
  let s = 0;
  const mks = ans.markets || [];
  if (mks.length) {
    const ov = idea.markets.filter(m => mks.includes(m)).length;
    s += (ov / Math.min(idea.markets.length, mks.length)) * 40;
  }
  if (idea.devLevels.includes(ans.devLevel)) s += 20;
  else if (ans.devLevel === 'senior') s += 16;
  else s += 5;
  if (idea.channels.includes(ans.channel)) s += 15;
  if (idea.types.includes(ans.type) || idea.types.includes('both') || ans.type === 'both') s += 10;
  if (idea.ais.includes(ans.ai)) s += 10;
  if (!idea.apiRequired || ans.budget !== 'zero') s += 5;
  return s;
}

function genResult(ans) {
  const ranked = IDEAS.map(i => ({i, s: score(i, ans)})).sort((a,b) => b.s - a.s);
  const best = ranked[0].i;
  let dAdj = 0;
  if (ans.devLevel === 'senior') dAdj = -12;
  if (ans.devLevel === 'beginner') dAdj = 12;
  if (ans.devLevel === 'none') dAdj = 25;
  return { ...best, dif: Math.min(100, Math.max(5, best.dif + dAdj)) };
}

          .map(([k,v])=>`<div style="background:var(--surface2);padding:14px 16px"><p style="font-size:11px;color:var(--text3);font-weight:500;margin-bottom:3px">${k}</p><p style="font-size:13px;font-weight:600">${v}</p></div>`).join('')}
      </div>
      <p style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Tech Stack</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${r.stack.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
    </div>

    <div class="card au" style="margin-bottom:14px">
      <p class="sh">Competitive Landscape</p>
      <p style="font-size:14px;color:var(--text2);font-style:italic;margin-bottom:16px;padding:12px 14px;background:var(--surface2);border-radius:8px;border-left:3px solid var(--border)">${r.pos}</p>
      ${r.competitors.map(c=>`
        <div class="comp-row">
          <span style="font-size:14px;font-weight:600">${c.n}</span>
          <span style="font-size:12px;color:var(--text3);max-width:55%;text-align:right">${c.p}</span>
        </div>`).join('')}
    </div>

    <div class="card au" style="margin-bottom:14px">
      <p class="sh">7-Day Roadmap</p>
      ${r.roadmap.map((item,i)=>`
        <div class="rm-item">
          <span class="mono" style="font-size:11px;color:var(--text3);min-width:38px;padding-top:2px">Day ${i+1}</span>
          <span style="font-size:14px;color:var(--text2)">${item}</span>
        </div>`).join('')}
    </div>

    <div class="card au" style="margin-bottom:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
        <p class="sh" style="margin:0">Claude Code Prompt</p>
        <button class="cp-btn" onclick="cp('cprompt',this)">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x=".5" y="3.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 2.5V2A1 1 0 0 1 4.5 1h5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Copy
        </button>
      </div>
      <div class="code" id="cprompt">${r.claude.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>

    <div class="card au" style="margin-bottom:14px">
      <p class="sh">TikTok Launch Plan</p>
      ${r.hooks.map((h,i)=>`
        <div style="padding:11px 0;border-bottom:1px solid var(--border);display:flex;gap:12px;align-items:flex-start">
          <span class="mono" style="font-size:11px;color:var(--text3);min-width:24px;padding-top:2px">V${i+1}</span>
          <p style="font-size:14px;color:var(--text2)">${h}</p>
        </div>`).join('')}
      <div style="margin-top:14px;padding:12px 14px;background:var(--surface2);border-radius:8px">
        <p style="font-size:13px;color:var(--text2);line-height:1.6"><strong style="color:var(--text)">Strategy:</strong> Post V1 on launch day. V2 next day (demo screen-record). V3 day 3 ("I built this in ${r.time}"). Cross-post to X + Instagram Reels.</p>
      </div>
    </div>

    <div class="card au" style="margin-bottom:32px">
      <p class="sh">Affiliate Partners</p>
      ${r.affiliates.map((a,i)=>`
        <div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-bottom:7px">
          <span class="mono" style="font-size:11px;color:var(--text3);min-width:18px">${i+1}</span>
          <span style="font-size:14px;color:var(--text2)">${a}</span>
        </div>`).join('')}
      <div style="margin-top:10px;padding:12px 14px;background:var(--surface2);border-radius:8px">
        <p style="font-size:13px;color:var(--text2)">Suggested: <strong style="color:var(--text)">30% recurring for 3 months</strong>. Reach out with a free account + 3-min Loom demo personalized to them.</p>
      </div>
    </div>

    <div class="au" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn-p" onclick="window.open('https://claude.ai/code','_blank')" style="flex:1;min-width:190px;justify-content:center">
        Build with Claude Code
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 6.5h9M7.5 2.5l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn-g" onclick="restart()" style="flex:1;min-width:130px;justify-content:center">Start Over</button>
    </div>
  </div>`;
}

function animateRings(r) {
  const C = 2 * Math.PI * 34;
  [
    { id:'r-vir', s: r.vir },
    { id:'r-com', s: 100 - r.com },
    { id:'r-dif', s: 100 - r.dif },
  ].forEach(({ id, s }) => {
    const el = document.getElementById(id);
    if (el) el.style.strokeDashoffset = C * (1 - s / 100);
  });
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function cp(id, btn) {
  const el = document.getElementById(id);
  if (!el) return;
  navigator.clipboard.writeText(el.innerText).then(() => {
    btn.classList.add('ok');
    btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M1.5 6.5l3 3 6-6" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> Copied!`;
    setTimeout(() => {
      btn.classList.remove('ok');
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x=".5" y="3.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 2.5V2A1 1 0 0 1 4.5 1h5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg> Copy`;
    }, 2200);
  });
}

function restart() { S.step = 0; S.ans = {}; S.result = null; render(); }

// ─── KEYBOARD ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (S.step === 0 && e.key === 'Enter') { go(1); return; }
  if (S.step >= 1 && S.step <= QS.length) {
    const q = QS[S.step - 1];
    if (!q.multi && ['1','2','3','4'].includes(e.key)) {
      const i = parseInt(e.key) - 1;
      if (i < q.opts.length) pick(q.id, q.opts[i].v, false, 99);
    }
    if (e.key === 'Escape') back();
  }
});

render();
</script>
</body>
</html>
